name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Live deployed BD & World News URL (leave default to use Shared App URL)'
        required: false
        default: 'https://ais-pre-2iled3ajarj2xqan7da4hx-642243976702.asia-east1.run.app'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build BD & World News APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install project dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Update Capacitor server URL if overridden
        if: ${{ github.event.inputs.app_url != '' }}
        env:
          INPUT_APP_URL: ${{ github.event.inputs.app_url }}
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.server = cfg.server || {};
            cfg.server.url = process.env.INPUT_APP_URL;
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2) + "\n");
          '

      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3

      - name: Generate Android project & sync assets
        run: |
          rm -rf android
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#0B6E4F' --iconBackgroundColorDark '#0B6E4F' --splashBackgroundColor '#F6F8F7' --splashBackgroundColorDark '#0D1211'
          npx cap sync android

      - name: Compile Android APK (Gradle)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/BD-World-News.apk
          ls -lh release-apk/BD-World-News.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BD-World-News-APK
          path: release-apk/BD-World-News.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: BD & World News (Android APK)
          body: |
            Automated Android APK build for **BD & World News** (English & বাংলা Daily News Aggregator).

            ### Install on OnePlus Nord CE 5 / Android
            1. Tap **BD-World-News.apk** below to download it directly to your phone.
            2. Open the downloaded `.apk` file in **Files** or **Chrome Downloads**.
            3. If prompted, allow **Install unknown apps** for Chrome / Files, then tap **Install**.
          files: release-apk/BD-World-News.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
